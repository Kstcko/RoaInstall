<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรไฟล์ | Install</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/custom.css?v=20261121-8" rel="stylesheet">
  <link href="css/profile.css?v=20261121-8" rel="stylesheet">
</head>
<body class="p-page">
  <main class="p-box">
    <div class="p-top">
      <label id="profilePhotoControl" class="p-photo" for="profileImageInput" aria-label="เปลี่ยนรูปโปรไฟล์">
        <img id="profileImage" src="https://i.pravatar.cc/128?img=12" alt="รูปโปรไฟล์">
        <span class="p-photo-btn"><i class="bi bi-camera"></i></span>
      </label>
      <input id="profileImageInput" class="p-photo-in" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
      <div>
        <h1>โปรไฟล์ของฉัน</h1>
        <p>ข้อมูลผู้ใช้งาน Install</p>
      </div>
    </div>

    <div id="profileInfo" class="p-info" hidden>
      <section class="p-section p-personal">
        <div class="p-heading">
          <h2>ข้อมูลส่วนตัว</h2>
          <button id="editProfileButton" class="btn light-button" type="button">แก้ไขชื่อ</button>
        </div>
        <div class="p-item"><strong>ชื่อ</strong><span id="profileName">-</span></div>
        <form id="profileForm" class="p-form" hidden>
          <div class="p-name">
            <label class="p-field" for="firstNameInput">ชื่อ
              <input id="firstNameInput" name="firstName" type="text" maxlength="80" autocomplete="given-name" required>
            </label>
            <label class="p-field" for="lastNameInput">นามสกุล
              <input id="lastNameInput" name="lastName" type="text" maxlength="80" autocomplete="family-name" required>
            </label>
          </div>
          <div class="form-actions">
            <button id="cancelProfileButton" class="btn light-button" type="button">ยกเลิก</button>
            <button id="saveProfileButton" class="btn btn-primary" type="submit">บันทึกชื่อ</button>
          </div>
        </form>
      </section>

      <section class="p-section p-contact">
        <h2>ข้อมูลติดต่อ</h2>
        <div class="p-item"><strong>อีเมล</strong><span id="profileEmail">-</span></div>
        <div class="p-item"><strong>เบอร์โทรศัพท์</strong><span id="profilePhone">-</span></div>
        <p class="p-note"><i class="bi bi-shield-lock"></i> ปิดการแก้ไขชั่วคราว จนกว่าจะเชื่อมต่อระบบยืนยัน OTP</p>
      </section>

      <section class="p-section p-access">
        <div class="p-heading">
          <h2>สิทธิ์การใช้งาน</h2>
          <a id="staffManagementLink" class="btn light-button p-staff" href="Staff.html" hidden>
            <i class="bi bi-people"></i> จัดการ Role
          </a>
        </div>
        <div class="p-item"><strong>Role</strong><span id="profileRole">-</span></div>
      </section>
    </div>

    <p id="profileMessage" class="p-message" role="status" aria-live="polite"></p>
    <div class="p-actions">
      <a class="btn light-button" href="index.html">กลับหน้าแรก</a>
      <a class="btn btn-primary" href="services.html">ไปหน้า Install</a>
      <a id="loginButton" class="btn btn-primary" href="Login.html">เข้าสู่ระบบ</a>
      <button id="logoutButton" class="btn light-button" type="button" hidden>ออกจากระบบ</button>
    </div>
  </main>

  <script src="js/core/storage.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/dialogs.js?v=20261013-1"></script>
  <script src="js/profile.js?v=20261121-8"></script>
</body>
</html>
