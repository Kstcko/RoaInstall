<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>เพิ่มงาน | Install</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<link href="css/custom.css?v=20261121-9" rel="stylesheet">
	<link href="css/work.css?v=20261121-9" rel="stylesheet">
</head>
<body class="work-page">
	<main class="work-wrap">
		<div class="work-head">
			<a class="work-back" href="services.html">
				<i class="bi bi-arrow-left"></i> กลับหน้ารายการงาน
			</a>
			<h1 id="formTitle">เพิ่มงานใหม่</h1>
			<p>กรอกข้อมูลด้านล่างเพื่อบันทึกงาน</p>
		</div>

		<form id="taskForm" class="work-form">
			<div class="work-row">
				<div class="work-field">
					<label for="taskId">เลขที่งาน</label>
					<input id="taskId" name="taskId" type="text" placeholder="เช่น JOB-001" required>
				</div>
				<div class="work-field">
					<label for="date">วันที่แจ้ง</label>
					<input id="date" name="date" type="date" required>
				</div>
			</div>

			<div class="work-field">
				<label for="department">ผู้ที่แจ้ง</label>
				<input id="department" name="department" type="text" autocomplete="name" readonly required>
			</div>

			<div class="work-field">
				<label for="detail">รายละเอียดงาน</label>
				<textarea id="detail" name="detail" placeholder="อธิบายรายละเอียดของงาน" required></textarea>
			</div>

			<div class="work-field">
				<label for="assetIdentifiers">Serial Number</label>
				<textarea id="assetIdentifiers" name="assetIdentifiers" rows="3" placeholder="กรอก Serial Number เครื่องละ 1 บรรทัด&#10;ถ้ามีหลายเครื่อง ให้ใส่เครื่องละ 1 บรรทัด"></textarea>
				<small id="assetIdentifiersHelp">เว้นว่างได้ถ้ามีเครื่องเดียวที่ไม่ต้องแยกหมายเลข หากมีหลายเครื่อง ระบบจะสร้างงานแยกให้แต่ละบรรทัด โดยใช้เลขที่งานและรายละเอียดชุดเดียวกัน</small>
			</div>

			<div class="work-field">
				<label for="dueAt">วันที่จัดส่ง</label>
				<input id="dueAt" name="dueAt" type="date" required>
			</div>

			<p id="taskFormMessage" class="work-message" role="status" aria-live="polite"></p>
			<div class="work-actions">
				<a class="btn light-button" href="services.html">ยกเลิก</a>
				<button id="saveButton" class="btn btn-primary" type="submit">บันทึกงาน</button>
			</div>
		</form>
	</main>

	<script src="js/core/storage.js"></script>
	<script src="js/core/auth.js"></script>
	<script src="js/core/dialogs.js?v=20261013-1"></script>
	<script src="js/tasks/task-store.js?v=20261121-9"></script>
	<script src="js/main.js?v=20261121-13"></script>
</body>
</html>
