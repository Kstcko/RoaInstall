<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Computer Install | Install</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/custom.css?v=20261121-9" rel="stylesheet">
  <link href="css/work.css?v=20261121-9" rel="stylesheet">
  <link href="css/report.css?v=20261121-1" rel="stylesheet">
</head>
<body class="work-page report-page">
  <main class="work-wrap report-wrap">
    <div class="work-head">
      <a class="work-back" href="services.html"><i class="bi bi-arrow-left"></i> กลับหน้ารายการงาน</a>
      <h1>Report Computer Install</h1>
      <p>สำหรับช่างที่ติดตั้งคอมพิวเตอร์ กรุณาเข้าสู่ระบบด้วยบัญชีบริษัทและกรอกข้อมูลให้ครบ</p>
    </div>

    <form id="installReportForm" class="work-form report-form" hidden>
      <div class="report-field">
        <label for="reportTask">งานที่ติดตั้งเสร็จแล้ว</label>
        <select id="reportTask" name="taskId" required>
          <option value="">กำลังโหลดรายการงาน...</option>
        </select>
        <small id="reportTaskDetails" class="report-hint" aria-live="polite"></small>
      </div>

      <div class="report-field">
        <label for="assignedTechnician">ช่างที่รับงาน / ผู้ตรวจ</label>
        <input id="assignedTechnician" type="text" readonly required>
      </div>

      <fieldset class="report-checklist">
        <legend>รายการตรวจสอบ</legend>
        <label><input id="specificationsChecked" type="checkbox" required> ตรวจสอบสเปคคอมพิวเตอร์แล้ว</label>
        <label><input id="neatnessChecked" type="checkbox" required> ตรวจสอบความเรียบร้อยแล้ว</label>
        <label><input id="warrantySealApplied" type="checkbox" required> ติดวอยเรียบร้อยแล้ว</label>
      </fieldset>

      <div class="report-row">
        <div class="report-field">
          <label for="computerType">รูปแบบคอมพิวเตอร์</label>
          <input id="computerType" name="computerType" type="text" maxlength="120" placeholder="เช่น Desktop, All-in-One, Notebook" required>
        </div>
        <div class="report-field">
          <label for="computerBrand">ยี่ห้อ</label>
          <input id="computerBrand" name="brand" type="text" maxlength="120" placeholder="ระบุยี่ห้อคอมพิวเตอร์" required>
        </div>
      </div>

      <div class="report-field">
        <label for="reportPhotos">ถ่ายและแนบรูปภาพทั้งหมด (1–5 รูป)</label>
        <input id="reportPhotos" name="photos" type="file" accept="image/*" capture="environment" multiple required>
        <small class="report-hint">แนบภาพเครื่องและจุดติดตั้งที่เกี่ยวข้อง ระบบจะปรับขนาดภาพก่อนส่ง</small>
        <div id="reportPhotoPreview" class="report-photo-preview" aria-live="polite"></div>
      </div>

      <p id="reportFormMessage" class="work-message" role="status" aria-live="polite"></p>
      <div class="work-actions">
        <a class="btn light-button" href="services.html">ยกเลิก</a>
        <button id="submitReport" class="btn btn-primary" type="submit" disabled>บันทึก Report</button>
      </div>
    </form>

    <section id="reportSuccess" class="work-form report-success" role="status" hidden>
      <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
      <h2>บันทึก Report เรียบร้อยแล้ว</h2>
      <p id="reportSuccessMessage"></p>
      <a class="btn btn-primary" href="services.html">กลับหน้ารายการงาน</a>
    </section>
  </main>

  <script src="js/core/storage.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/install-report.js?v=20261121-1"></script>
</body>
</html>
