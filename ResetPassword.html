<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ | Install</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
    <link href="css/login.css?v=3" rel="stylesheet">
</head>
<body class="a-page">
    <main class="a-box">
        <a class="a-back" href="Login.html"><i class="bi bi-arrow-left"></i><span>กลับเข้าสู่ระบบ</span></a>
        <div class="a-brand">Install<span>.</span></div>
        <h1>ตั้งรหัสผ่านใหม่</h1>
        <p class="a-sub">รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษร</p>
        <form id="resetPasswordForm" class="a-form" novalidate>
            <div class="a-field">
                <label for="newPassword">รหัสผ่านใหม่</label>
                <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
            </div>
            <div class="a-field">
                <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
                <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
            </div>
            <button type="submit" class="btn btn-primary a-submit">บันทึกรหัสผ่านใหม่</button>
            <p id="resetPasswordMessage" class="a-error" role="alert" aria-live="polite"></p>
        </form>
    </main>
    <script src="js/password-reset.js?v=1"></script>
</body>
</html>
