<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | Install</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
    <link href="css/login.css?v=2" rel="stylesheet">
</head>

<body class="a-page">
    <main class="a-box">
        <a class="a-back" href="index.html" aria-label="ย้อนกลับไปหน้าแรก"><i class="bi bi-arrow-left"></i><span>ย้อนกลับ</span></a>
        <div class="a-brand">Install<span>.</span></div>
        <h1>เข้าสู่ระบบ</h1>
        <p class="a-sub">กรุณาเข้าสู่ระบบเพื่อจัดการงานของคุณ</p>

        <form id="loginForm" class="a-form" novalidate>
            <div class="a-field">
                <label for="email">อีเมล</label>
                <input id="email" name="email" type="email" placeholder="name@rayong-oa.com" required>
                <small class="a-hint">ใช้อีเมล @rayong-oa.com (บัญชี Developer ใช้อีเมลที่กำหนดไว้)</small>
            </div>
            <div class="a-field">
                <div class="a-label">
                    <label for="password">รหัสผ่าน</label>
                    <a id="forgotPasswordLink" href="#forgot-password">ลืมรหัสผ่าน?</a>
                </div>
                <input id="password" name="password" type="password" placeholder="กรอกรหัสผ่านของคุณ" required>
            </div>
            <label class="a-remember"><input type="checkbox" name="remember"> จดจำการเข้าสู่ระบบ</label>
            <button type="submit" class="btn btn-primary a-submit">เข้าสู่ระบบ</button>
            <p id="loginError" class="a-error" role="alert" aria-live="polite"></p>
        </form>

        <p id="passwordResetSuccess" class="a-success" role="status" aria-live="polite" hidden>ตั้งรหัสผ่านใหม่สำเร็จ กรุณาเข้าสู่ระบบ</p>
        <p class="a-footer">ยังไม่มีบัญชี? <a href="Register.html">สมัครสมาชิก</a></p>
    </main>
        <div id="forgotPasswordDialog" class="a-dialog" role="dialog" aria-modal="true" aria-labelledby="forgotPasswordTitle" hidden>
            <form id="forgotPasswordForm" class="a-reset">
                <h2 id="forgotPasswordTitle">กู้คืนรหัสผ่าน</h2>
                <p>กรอกอีเมลบัญชี ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ให้หากพบอีเมลนี้</p>
                <label for="recoveryEmail">อีเมล</label>
                <input id="recoveryEmail" type="email" autocomplete="email" required>
                <p id="recoveryMessage" class="a-error" role="status" aria-live="polite"></p>
                <div class="a-actions">
                    <button id="cancelPasswordReset" class="btn light-button" type="button">ยกเลิก</button>
                    <button class="btn btn-primary" type="submit">ส่งลิงก์ตั้งรหัสผ่าน</button>
                </div>
            </form>
        </div>
        <script src="js/core/storage.js"></script>
        <script src="js/core/auth.js"></script>
        <script src="js/login.js?v=3"></script>
</body>
</html>
